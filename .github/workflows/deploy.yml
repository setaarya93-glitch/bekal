name: Deploy to FTP

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      
    - name: Setup PHP
      uses: shivammathur/setup-php@v2
      with:
        php-version: '8.2'
        extensions: mbstring, xml, ctype, json, tokenizer, bcmath, curl, mysql, pdo, pdo_mysql, zip, gd, intl
        
    - name: Install Composer dependencies
      run: |
        composer install --no-dev --optimize-autoloader --no-interaction
        
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        
    - name: Install NPM dependencies & Build
      run: |
        npm ci
        npm run build
        
    - name: Prepare deployment
      run: |
        # Copy .env.example to .env for deployment
        cp .env.example .env
        php artisan key:generate --force
        # Remove development files
        rm -rf .git .github tests phpunit.xml .env.testing
        
    - name: Deploy to FTP
      uses: SamKirkland/FTP-Deploy-Action@v4.3.5
      with:
        server: ${{ secrets.FTP_SERVER }}
        username: ${{ secrets.FTP_USERNAME }}
        password: ${{ secrets.FTP_PASSWORD }}
        local-dir: ./
        server-dir: /public_html/bekal/
        exclude: |
          **/.git*
          **/.git*/**
          **/node_modules/**
          **/tests/**
          **/.env.local
          **/.env.testing
          **/phpunit.xml
          **/*.md
          **/storage/logs/**
          **/storage/framework/cache/**
          **/storage/framework/sessions/**
          **/storage/framework/views/**
        dangerous-clean-slate: false
        
    - name: Post deployment notification
      if: success()
      run: echo "Deployment to thedarkandbright.site/public_html/bekal completed successfully!"
