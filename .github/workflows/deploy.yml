name: Deploy to FTP

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      
    - name: Setup PHP
      uses: shivammathur/setup-php@v2
      with:
        php-version: '8.3'
        extensions: mbstring, xml, ctype, json, tokenizer, bcmath, curl, mysql, pdo, pdo_mysql, zip, gd, intl
        
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        
    - name: Install NPM dependencies & Build
      run: |
        npm ci
        npm run build
        
    - name: Prepare deployment
      run: |
        # Copy .env.example to .env for deployment
        cp .env.example .env
        # Generate APP_KEY without artisan (base64 encoded random 32 bytes)
        APP_KEY=$(openssl rand -base64 32 | tr -d '\n')
        sed -i "s/APP_KEY=.*/APP_KEY=base64:$APP_KEY/" .env
        # Create required storage directories
        mkdir -p storage/framework/views
        mkdir -p storage/framework/cache
        mkdir -p storage/framework/sessions
        mkdir -p storage/logs
        mkdir -p bootstrap/cache
        # Create .gitkeep files to ensure directories are tracked
        touch storage/framework/views/.gitkeep
        touch storage/framework/cache/.gitkeep
        touch storage/framework/sessions/.gitkeep
        touch storage/logs/.gitkeep
        touch bootstrap/cache/.gitkeep
        # Remove development files
        rm -rf .git .github tests phpunit.xml .env.testing
        
    - name: Deploy to FTP
      uses: SamKirkland/FTP-Deploy-Action@v4.3.5
      with:
        server: ${{ secrets.FTP_SERVER }}
        username: ${{ secrets.FTP_USERNAME }}
        password: ${{ secrets.FTP_PASSWORD }}
        local-dir: ./
        server-dir: /public_html/sample.thedarkandbright.com/
        exclude: |
          **/.git*
          **/.git*/**
          **/node_modules/**
          **/vendor/**
          **/tests/**
          **/.env.local
          **/.env.testing
          **/phpunit.xml
          **/*.md
          **/storage/logs/**
        dangerous-clean-slate: false
        
    - name: Post deployment notification
      if: success()
      run: echo "Deployment to public_html/sample.thedarkandbright.com completed successfully!"
